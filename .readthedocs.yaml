# Native static Astro PR previews; no Python/Sphinx environment or deploy token.
# https://docs.readthedocs.com/platform/stable/build-customization.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    nodejs: '24'
  jobs:
    install:
      - npm ci
    build:
      html:
        - node scripts/readthedocs-build.mjs
